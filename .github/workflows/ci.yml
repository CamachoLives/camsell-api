name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build y tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Compilar y ejecutar tests
        run: mvn -B verify

      - name: Publicar reporte de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: ignore

  smoke:
    name: Smoke test del jar empaquetado
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Empaquetar
        run: mvn -B -q package -DskipTests

      # Los tests cubren el contexto de Spring, pero no que el jar realmente
      # arranque y responda: eso solo se ve ejecutandolo.
      - name: Arrancar la aplicacion
        run: |
          java -jar target/camsell-api-*.jar \
            --camsell.demo-data.enabled=true > app.log 2>&1 &
          echo $! > app.pid

      - name: Esperar a que este lista
        run: |
          for attempt in $(seq 1 45); do
            if curl -sf http://localhost:8081/actuator/health/readiness | grep -q UP; then
              echo "Aplicacion lista tras ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "La aplicacion no quedo lista; ultimas lineas del log:"
          tail -40 app.log
          exit 1

      - name: Verificar el contrato publico
        run: |
          set -euo pipefail
          # Las respuestas se guardan en archivo antes de inspeccionarlas: con
          # pipefail, un `grep -q` cierra la tuberia y curl aborta con error de
          # escritura aunque la verificacion haya pasado.

          echo "Esquema de parametros disponible"
          curl -sf http://localhost:8080/api/v1/parameters/groups -o parameters.json
          grep -q '"code":"FUEL_TYPE"' parameters.json

          echo "Compresion activa"
          curl -sf -H 'Accept-Encoding: gzip' -D headers.txt -o /dev/null \
            'http://localhost:8080/api/v1/listings?size=50'
          grep -iq '^content-encoding: gzip' headers.txt

          echo "Revalidacion por ETag"
          curl -sf -D etag-headers.txt -o /dev/null http://localhost:8080/api/v1/parameters/groups
          etag=$(grep -i '^etag:' etag-headers.txt | sed 's/^[Ee][Tt]ag: //' | tr -d '\r')
          test -n "$etag" || { echo "La respuesta no trajo ETag"; exit 1; }
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "If-None-Match: $etag" http://localhost:8080/api/v1/parameters/groups)
          test "$status" = "304" || { echo "Se esperaba 304, se obtuvo $status"; exit 1; }

          echo "Actuator no se expone en el puerto publico"
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/prometheus)
          test "$status" != "200" || { echo "Actuator quedo expuesto en el puerto publico"; exit 1; }

          echo "Metricas de negocio publicadas en el puerto de gestion"
          curl -sf http://localhost:8081/actuator/prometheus -o metrics.txt
          grep -q '^camsell_' metrics.txt

      - name: Detener la aplicacion
        if: always()
        run: kill "$(cat app.pid)" || true

      - name: Publicar el log de arranque
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-app-log
          path: app.log

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t camsell-api:${{ github.sha }} .
