spring:
  application:
    name: camsell-api
  profiles:
    active: ${CAMSELL_PROFILE:dev}
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      # Los campos booleanos opcionales de los payloads pueden omitirse y
      # entonces valen false, en lugar de romper la peticion.
      fail-on-null-for-primitives: false
      fail-on-unknown-properties: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${CAMSELL_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  # El JSON del catalogo comprime muy bien; en una busqueda tipica baja de
  # decenas de kilobytes a unos pocos.
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,application/yaml,text/plain
    min-response-size: 1KB
  http2:
    enabled: true
  tomcat:
    threads:
      max: 100
    max-http-form-post-size: 256KB
    max-swallow-size: 2MB
    connection-timeout: 20s

management:
  server:
    # Las metricas describen el comportamiento interno del sistema; viven en un
    # puerto aparte que no se publica hacia afuera.
    port: ${CAMSELL_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
  metrics:
    tags:
      application: camsell-api
    distribution:
      # Se publican buckets y no percentiles ya calculados: Prometheus los
      # agrega entre instancias con histogram_quantile, mientras que un
      # percentil calculado en cada proceso no se puede promediar. Una media
      # esconde justamente las peticiones que hacen sentir lento el sitio.
      percentiles-histogram:
        http.server.requests: true
        camsell.catalog.search: true
      slo:
        http.server.requests: 100ms, 300ms, 800ms
  observations:
    key-values:
      application: camsell-api
  prometheus:
    metrics:
      export:
        enabled: true

camsell:
  rate-limit:
    enabled: ${CAMSELL_RATE_LIMIT:true}
    # Frena la fuerza bruta contra el inicio de sesion sin estorbar a una
    # persona que se equivoca de clave un par de veces.
    credential-attempts-per-minute: 10
    writes-per-minute: 60
  demo-data:
    enabled: ${CAMSELL_DEMO_DATA:false}
  jwt:
    secret: ${CAMSELL_JWT_SECRET:camsell-local-dev-secret-please-rotate-in-production-0001}
    issuer: camsell-api
    access-token-ttl: PT12H
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:4173
  catalog:
    max-images-per-listing: 12
    max-featured-listings: 8
    min-year: 1950

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-------------}] %logger{32} : %msg%n"
  level:
    com.camsell: INFO

info:
  app:
    name: Camsell API
    description: Marketplace parametrizable de compra y venta de vehiculos
    version: 1.0.0

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:camsell;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

camsell:
  demo-data:
    enabled: ${CAMSELL_DEMO_DATA:true}

---
# En produccion los logs van a un agregador, no a una consola humana: el
# formato ECS los deja indexables y conserva el requestId del MDC como campo.
logging:
  structured:
    format:
      console: ecs

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${CAMSELL_DB_URL:jdbc:postgresql://localhost:5432/camsell}
    username: ${CAMSELL_DB_USER:camsell}
    password: ${CAMSELL_DB_PASSWORD:camsell}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
